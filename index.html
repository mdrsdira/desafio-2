<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Inscrição Trilhas</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
<div>
    <h1>Formulário de inscrição</h1>
    <p>preencha os dados abaixo para fazer sua inscrição no Programa Trilhas.</p>
    <h2>Informações do participante</h2>
</div>

<div>
    <label for="Nome completo">Nome completo</label>
    <input type="nome completo" id="nome completo" name="nome completo" required>

    <label for="data de nascimento">Data de nascimento</label>
    <input type="date" id="nascimento" name="nascimento" required>

    <label for="cpf">Cpf</label>
    <input type="cpf" id="cpf" name="cpf" required>

    <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo" required>
        <option value="" disabled selected>Selecione...</option>
        <option value="feminino">Feminino</option>
        <option value="masculino">Masculino</option>
        <option value="outro">Não-Binário</option>
        <option value="nao_informar">Prefiro não informar</option>
    </select>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="telefone">Telefone</label>
    <input type="number" id="telefone" name="telefone" pattern="[0-9]{10,11}" title="Digite apenas os números com DDD" required>

    <input type="checkbox" id="aceite" name="aceite" required>
  <label for="aceite">
    Declaro que li e concordo com os <a href="#">Termos e Condições</a> e com a <a href="#">Política de Privacidade</a>.
  </label>

  <br><br>

  <button type="reset">Cancelar</button>
  <button type="submit">Fazer inscrição</button>

</div>

</body>
</html>
